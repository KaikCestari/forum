[package]
name = "aqua-processor"
version = "0.1.0"
edition = "2021"
description = "Limpeza, agregação e cálculo do IQA para dados de qualidade da água"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
