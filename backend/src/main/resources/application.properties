# lê o .env da raiz (variáveis de ambiente têm prioridade)
spring.application.name=aquaml-backend
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8080}

# Banco
spring.datasource.url=${AQUAML_DB_URL:jdbc:h2:file:../data/db/aquaml-spring;AUTO_SERVER=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Uploads (o limite de 12 MB das imagens é conferido no ImageService)
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=100MB

aquaml.storage.images-dir=${AQUAML_IMAGES_DIR:../data/images}
aquaml.sample-data=${AQUAML_SAMPLE_DATA:true}

# Segurança
aquaml.jwt.secret=${JWT_SECRET:}
aquaml.admin.email=${ADMIN_EMAIL:admin@aquaml.local}
aquaml.admin.password=${ADMIN_PASSWORD:admin123}

# Serviço de ML
aquaml.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
aquaml.cors-origins=${AQUAML_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Ollama
aquaml.ollama.url=${OLLAMA_URL:http://localhost:11434}
aquaml.ollama.api-key=${OLLAMA_API_KEY:}
aquaml.ollama.model=${LLAMA_MODEL:llama3.2}
aquaml.ollama.vision-model=${VISION_MODEL:gemma4:31b}

spring.jackson.default-property-inclusion=always
logging.level.org.hibernate.orm.deprecation=error
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.default-support-form-data=true

# Console do H2 (/h2-console), só desta máquina
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
