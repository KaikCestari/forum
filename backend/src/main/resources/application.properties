# AquaML - backend Spring Boot
# O arquivo .env da raiz do repositório é lido como fonte opcional; variáveis de ambiente têm prioridade.
spring.application.name=aquaml-backend
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8080}

# Banco H2 em arquivo (data/db na raiz do repositório). Troque com AQUAML_DB_URL.
spring.datasource.url=${AQUAML_DB_URL:jdbc:h2:file:../data/db/aquaml-spring;AUTO_SERVER=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Uploads: imagens até 12 MB (conferido no caso de uso) e planilhas CSV maiores.
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=100MB

# Pasta das imagens enviadas (data/images na raiz do repositório).
aquaml.storage.images-dir=${AQUAML_IMAGES_DIR:../data/images}

# Segurança
aquaml.jwt.secret=${JWT_SECRET:}
aquaml.admin.email=${ADMIN_EMAIL:admin@aquaml.local}
aquaml.admin.password=${ADMIN_PASSWORD:admin123}

# Serviço de machine learning (Python/FastAPI)
aquaml.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
aquaml.cors-origins=${AQUAML_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Ollama (assistente e modelo com visão)
aquaml.ollama.url=${OLLAMA_URL:http://localhost:11434}
aquaml.ollama.api-key=${OLLAMA_API_KEY:}
aquaml.ollama.model=${LLAMA_MODEL:llama3.2}
aquaml.ollama.vision-model=${VISION_MODEL:gemma4:31b}

spring.jackson.default-property-inclusion=always
logging.level.org.hibernate.orm.deprecation=error
# Não usamos o usuário em memória padrão do Spring Security (o login é por JWT).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
