$kind: http-request
description: ""
url: "{{baseUrl}}/api/stations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.environment.set("stationId", pm.response.json()[0].id);
    language: text/javascript
order: 1000
