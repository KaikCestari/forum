$kind: http-request
description: ""
url: "{{baseUrl}}/api/stations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Córrego do Teste",
      "type": "rio",
      "lat": -22.9,
      "lon": -47.06
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Criada (201) ou já existe (400)", () => pm.expect(pm.response.code).to.be.oneOf([201, 400]));
    language: text/javascript
order: 3000
