$kind: http-request
description: ""
url: "{{baseUrl}}/api/analysis/latest"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const a = pm.response.json();
      pm.test("Tem estações e alertas", () => { pm.expect(a.stations.length).to.be.above(0); pm.expect(a.alerts).to.be.an("array"); });
    language: text/javascript
order: 1000
