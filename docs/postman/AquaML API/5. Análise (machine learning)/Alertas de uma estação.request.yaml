$kind: http-request
description: ""
url: "{{baseUrl}}/api/alerts?station={{stationId}}"
method: GET
queryParams:
  station: "{{stationId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
