$kind: http-request
description: ""
url: "{{baseUrl}}/api/images/{{imageId}}/confirm"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "waterColor": "marrom e escura",
      "turbidity": "alta",
      "algaeBloom": false,
      "foam": false,
      "oil": false,
      "floatingDebris": false,
      "attentionLevel": 2,
      "notes": "Encontro de águas com sedimento em suspensão."
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Confirmada", () => pm.expect(pm.response.json().status).to.eql("CONFIRMADA"));
    language: text/javascript
order: 4000
