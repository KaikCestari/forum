$kind: http-request
description: ""
url: "{{baseUrl}}/api/stations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Não deveria criar",
      "type": "rio"
    }
auth:
  type: bearer
  credentials:
    token: "{{funcToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
