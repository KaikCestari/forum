$kind: http-request
description: ""
url: "{{baseUrl}}/api/users"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const u = pm.response.json().find(x => x.email === pm.environment.get("funcEmail"));
      if (u) pm.environment.set("userId", u.id);
    language: text/javascript
order: 2000
